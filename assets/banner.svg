<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    .pill { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 16; }
    
    /* Animated dynamic elements placed strictly in background / side panels */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .node { animation: pulseNode 3s infinite ease-in-out; transform-origin: center; }
    .data-stream { stroke-dasharray: 8 8; animation: flowLine 2s linear infinite; }
    .card-float1 { animation: floatCard 4s infinite ease-in-out; }
    .card-float2 { animation: floatCard 4s infinite ease-in-out 2s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" class="bg" rx="16"/>

  <!-- Subtle Grid Overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" />
  </g>

  <!-- Dynamic Animated Visuals (Right Side Infrastructure Topology) -->
  <g transform="translate(820, 40)" filter="url(#shadow)">
    <!-- Node Connection Lines -->
    <path d="M 100 80 L 220 50 M 100 80 L 220 150 M 100 80 L 100 220 M 220 150 L 220 220 M 100 220 L 220 220" stroke="#475569" stroke-width="2"/>
    <path d="M 100 80 L 220 50 M 100 80 L 220 150 M 100 80 L 100 220" stroke="#38bdf8" stroke-width="2" class="data-stream"/>

    <!-- Database Cylinder Nodes -->
    <!-- Central Node -->
    <g transform="translate(70, 50)" class="node card-float1">
      <ellipse cx="30" cy="15" rx="30" ry="10" fill="url(#accentGrad)"/>
      <path d="M 0 15 L 0 45 A 30 10 0 0 0 60 45 L 60 15 Z" fill="url(#accentGrad)" opacity="0.85"/>
      <ellipse cx="30" cy="45" rx="30" ry="10" fill="#0284c7"/>
    </g>

    <!-- Node Top Right -->
    <g transform="translate(190, 20)" class="node card-float2">
      <ellipse cx="25" cy="12" rx="25" ry="8" fill="#818cf8"/>
      <path d="M 0 12 L 0 36 A 25 8 0 0 0 50 36 L 50 12 Z" fill="#818cf8" opacity="0.85"/>
      <ellipse cx="25" cy="36" rx="25" ry="8" fill="#6366f1"/>
    </g>

    <!-- Node Mid Right -->
    <g transform="translate(190, 120)" class="node card-float1">
      <ellipse cx="25" cy="12" rx="25" ry="8" fill="#c084fc"/>
      <path d="M 0 12 L 0 36 A 25 8 0 0 0 50 36 L 50 12 Z" fill="#c084fc" opacity="0.85"/>
      <ellipse cx="25" cy="36" rx="25" ry="8" fill="#a855f7"/>
    </g>

    <!-- Node Bottom -->
    <g transform="translate(70, 190)" class="node card-float2">
      <ellipse cx="25" cy="12" rx="25" ry="8" fill="#34d399"/>
      <path d="M 0 12 L 0 36 A 25 8 0 0 0 50 36 L 50 12 Z" fill="#34d399" opacity="0.85"/>
      <ellipse cx="25" cy="36" rx="25" ry="8" fill="#10b981"/>
    </g>
  </g>

  <!-- Left Side Content Container (Guaranteed Unobscured Text Foreground) -->
  <g transform="translate(70, 80)">
    <!-- Category Tag -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="220" height="32" class="pill"/>
      <circle cx="16" cy="16" r="6" fill="#38bdf8" class="node"/>
      <text x="32" y="21" class="badge-text">RDBMS ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title" filter="url(#glow)">Awesome Relational Database</text>
    <text x="0" y="130" class="title" fill="#ffffff">Management Systems (RDBMS)</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated SaaS Platforms, Cloud Engines &amp; Open-Source SQL Systems</text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="110" height="32" class="pill"/>
      <text x="18" y="21" class="badge-text">⚡ Distributed</text>

      <rect x="122" y="0" width="95" height="32" class="pill"/>
      <text x="140" y="21" class="badge-text">🔒 ACID</text>

      <rect x="229" y="0" width="125" height="32" class="pill"/>
      <text x="247" y="21" class="badge-text">📊 SQL / HTAP</text>

      <rect x="366" y="0" width="115" height="32" class="pill"/>
      <text x="384" y="21" class="badge-text">☁️ Cloud Native</text>
    </g>
  </g>
</svg>
